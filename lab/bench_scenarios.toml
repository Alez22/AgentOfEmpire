# Bench scenarios: stored council calls (model_calls.id) with a known trap.
# lab/bench.py sends each one, unchanged except for a regenerated memory
# section (ministers), to every candidate model.
#
# forbidden / expected: orders matched by their keys (a missing key matches
# anything). Extra key "food_below": an assign_workers with fewer farmers.
# Proposals are read for ministers, the plan for the Chancellor.
# Chosen 2026-11-07 from games 9, 10, 14 and 17.

[[scenario]]
id = "1-treasurer-winter"
call_id = 746
note = "January, food 1600, winter yield 392 against 860 eaten; petition on taxes"
forbidden = [{ action = "set_ration", ration = "abundant" }]
expected = []

