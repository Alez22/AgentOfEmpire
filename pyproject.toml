[project]
name = "agent-of-empire"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.setuptools]
packages = ["engine"]

[tool.setuptools.package-data]
engine = ["config.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
