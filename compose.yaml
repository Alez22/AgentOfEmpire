services:
  # PostgreSQL for the game. Data lives in the "pgdata" volume, so it
  # survives "docker compose down" (but not "down -v").
  postgres:
    image: postgres:18.6
    environment:
      # game_admin is the superuser of this development container and owns
      # every table; agents read through the filtered agent_reader role.
      POSTGRES_USER: game_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: consiglio
    volumes:
      # Since Postgres 18 the image expects the volume at /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    ports:
      # Only reachable from this PC (psql, graphical clients), never from the network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_admin -d consiglio"]
      interval: 2s
      timeout: 3s
      retries: 15

  # HTTP API: docker compose up server  ->  http://127.0.0.1:8000/docs
  # Applies pending migrations at start, then reloads on every code change.
  server:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOME: /tmp
      DATABASE_URL: postgresql://game_admin:${POSTGRES_PASSWORD}@postgres:5432/consiglio
      # Only the server sees the OpenRouter key. COUNCIL_PROVIDER=openrouter
      # switches from the fake council to real models.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      COUNCIL_PROVIDER: ${COUNCIL_PROVIDER:-}
      # ADMIN_VIEW=1 enables /admin (everything, secrets included).
      ADMIN_VIEW: ${ADMIN_VIEW:-}
    volumes:
      - .:/app
    ports:
      # No authentication yet: reachable only from this PC. The binding on
      # the owner's Tailscale address lives in compose.override.yaml (not
      # committed, see compose.override.example.yaml), so the address stays
      # out of the public repo and a missing override is the safe default.
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "python -m server.db.migrate &&
             uvicorn server.app:app --host 0.0.0.0 --port 8000 --reload"

  # Run the tests: docker compose run --rm tests
  # Extra pytest arguments go after the service name, e.g.
  #   docker compose run --rm tests pytest -k validator -x
  # Apply migrations to the main database:
  #   docker compose run --rm tests python -m server.db.migrate
  tests:
    build: .
    # Run as the host user so files created in /app (.pytest_cache,
    # .hypothesis) are not owned by root.
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOME: /tmp  # the host user has no home directory inside the image
      DATABASE_URL: postgresql://game_admin:${POSTGRES_PASSWORD}@postgres:5432/consiglio
      # The DB tests create and drop their own database through this one.
      TEST_ADMIN_DATABASE_URL: postgresql://game_admin:${POSTGRES_PASSWORD}@postgres:5432/postgres
    volumes:
      - .:/app
    command: pytest -q

volumes:
  pgdata:
