# Council settings (server side). Model ids checked against the OpenRouter
# model list on 2026-11-06. Changing a model needs no code change.

# "fake" = deterministic answers, no network, no cost (tests, free play).
# "openrouter" = real models; needs OPENROUTER_API_KEY in .env.
provider = "fake"
base_url = "https://openrouter.ai/api/v1"
language = "Italian"  # language of every text the sovereign reads

budget_usd_per_game = 1.0
timeout_seconds = 90  # deadline on the whole call; game 7 had ok calls up to 92 s
# Reasoning included. GLM 5.3 Flash: longest good reply 4,566, 99% under 3,500
# (games 16-20); a runaway stops here in about 45 s and is retried at a lower level.
max_output_tokens = 6000
max_directives_per_turn = 2
history_turns = 6  # past turns of own proposals (and what followed) in each briefing
max_lessons = 10  # active lessons per council member; no automatic forgetting
max_audience_messages_per_turn = 6  # sovereign lines per council member per turn

# Every request asks OpenRouter for providers that accept all its parameters
# (provider.require_parameters). A model listed here never gets that
# parameter, or no provider would be left (checked 2026-11-07):
# - Ling 3.1 Flash: the only provider open to this account (Novita) rejects
#   response_format; replies are still validated as JSON.
# - Mistral Small 3.2: no reasoning at all.
models_without_json_schema = ["inclusionai/ling-3.1-flash"]
models_without_reasoning = ["mistralai/mistral-small-3.2-24b-instruct"]
# Reasoning cannot be turned off ("none" gives HTTP 400, game 20): a retry
# after a reply that ran up to the token cap uses "low" instead.
models_reasoning_required = ["z-ai/glm-5.3-flash"]

# Model tiers of the persons (server/council/personas.toml). Since
# 2026-11-08 every tier is GLM 5.3 Flash with reasoning "high" (set below,
# per role): the best of the bench (PLAN.md, "Lab: bench of the council
# models"), at about $0.001 a call. Later the player chooses these on a
# settings page.
# Roles with another output cap than max_output_tokens. The Architect reads
# the hex map: 600-4,700 output tokens in the third probe, one control reply
# 6,850 (lab/hex_probe.py, 2026-11-08); 10,000 keeps the runaway guard.
[max_output_tokens_by_role]
architect = 10000

[model_tiers]
low = "z-ai/glm-5.3-flash"
medium = "z-ai/glm-5.3-flash"
high = "z-ai/glm-5.3-flash"

# Used for games created without persons, and for the roles without a person.
[models]
chancellor = "z-ai/glm-5.3-flash"
treasurer = "z-ai/glm-5.3-flash"
architect = "z-ai/glm-5.3-flash"
gastaldo = "z-ai/glm-5.3-flash"  # village block B+C: games without persons
# The Voice stays on DeepSeek Flash without reasoning: on GLM "high" its
# Italian had invented words (game 18), and its text reaches the sovereign as is.
square_voice = "deepseek/deepseek-v4.1-flash"
# The people decide their behaviour and petitions (server/council/people.py);
# GLM "high" since 2026-11-08 (game 18: sound decisions, same cost as Flash).
people = "z-ai/glm-5.3-flash"

# Reasoning effort per role ("none", "low", "medium", "high"); a role missing
# here uses the model default. Reasoning is billed as output tokens and is
# most of the time and cost of a call. GLM 5.3 Flash: "high" about 1300-1500
# output tokens a call, 9-11 s; "medium" wrote less than "low" (game 17).
[reasoning_effort]
chancellor = "high"
treasurer = "high"
architect = "high"
gastaldo = "high"
square_voice = "none"
people = "high"

# USD per million tokens, used only when a response carries no cost field.
[prices.'deepseek/deepseek-v4.1-flash']
input = 0.051
output = 0.567

[prices.'deepseek/deepseek-v4-pro']
input = 0.75
output = 1.50

[prices.'mistralai/mistral-small-3.2-24b-instruct']
input = 0.075
output = 0.20

[prices.'openai/gpt-oss-120b']
input = 0.027
output = 0.099

[prices.'inclusionai/ling-3.1-flash']
input = 0.045
output = 0.135

[prices.'z-ai/glm-5.3-flash']
input = 0.15
output = 0.50

[prices.'z-ai/glm-5.3']
input = 0.07
output = 1.40
