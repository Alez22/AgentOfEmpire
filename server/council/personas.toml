# The people who can sit on a council. A role is the office (generic);
# a persona is the person in it: name, gender, character, story, the tier
# of mind that thinks for it and the salary it asks.
#
# group = "moderate": drawn at the start of a game (traits near the centre).
# group = "extreme": strong characters, for hiring later (not drawn yet).
# Traits 0..1000; they reach the prompt as words, never as numbers.
# tier: "low" | "medium" | "high"; which model each tier means is set in
# server/council.toml [model_tiers] (later on a settings page), never here.
# salary: gold a month, paid by the engine after the buildings' upkeep.
# Halved on 2026-11-08 (rounded up): with 10 gold a month for a council and
# taxes at 8%, the treasury kept about 4 gold a month and land was out of reach.
# Small test set (2026-11-07): 2 moderate + 2 extreme per role; a third
# moderate per role on 2026-11-08, for games of three realms.

