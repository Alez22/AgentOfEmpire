# Initial balance values for the prototype (one city, one class: peasants).
# All values are integers: "permille" = per thousand, "pct" = per hundred.
# Tuning happens here, never in the code.

[start]
children = 30
adults = 60
elders = 10
food = 1600  # was 2000: a sensible player now reaches spring with a thin margin (lab, game 3)
wood = 150
stone = 100
gold = 100
free_tiles = 7  # only for games without a map (saved before the territory)
workers_food = 54
workers_wood = 4
workers_stone = 2
tax_rate = 10
ration = "normal"
mood = 500  # was 600: equal to the base, so the mood no longer drifts down by itself
farms = 4
sawmills = 1
quarries = 1
houses = 6

# Each building: cost, construction time, jobs, output per worker per month.
# sector = which resource the workers produce ("" for houses).
# width x height = footprint in tiles; terrain = what every tile must be;
# needs_forest = at least one tile must touch a forest tile.
[buildings.farm]
wood = 40
stone = 10
gold = 0
build_turns = 2
jobs = 15
output_per_worker = 15
sector = "food"
housing = 0
width = 3
height = 3
terrain = "plain"

[buildings.sawmill]
wood = 30
stone = 20
gold = 0
build_turns = 2
jobs = 10
output_per_worker = 6
sector = "wood"
housing = 0
width = 2
height = 1
terrain = "plain"
needs_forest = true

[buildings.quarry]
wood = 40
stone = 10
gold = 0
build_turns = 2
jobs = 10
output_per_worker = 4
sector = "stone"
housing = 0
width = 2
height = 2
terrain = "hill"

[buildings.house]
wood = 30
stone = 30
gold = 20
build_turns = 3
jobs = 0
output_per_worker = 0
sector = ""
housing = 20
width = 1
height = 1
terrain = "plain"

# The territory (docs/DESIGN.md, "Territory"). Without this section (games
# saved before) a realm has no map and counts free_tiles instead.
[map]
world_file = "world.txt"  # in engine/maps/; copied into the state at game start
core_file = "core.toml"
# Top-left tile of the 8 starting sites; the seed picks one.
sites = [[4, 4], [26, 4], [48, 4], [4, 26], [48, 26], [4, 48], [26, 48], [48, 48]]
core_size = 12
square_size = 2
max_zones = 12
demolish_gold = 10
demolish_refund_pct = 25  # of the wood and stone the building cost
# Claiming a bordering tile: gold per tile = base + 1 for every claim_step_tiles
# tiles already owned beyond the core. The gold goes to the land fund.
claim_base_gold = 10
claim_step_tiles = 8
claim_max_per_order = 4
# Clearing a claimed tile, in worker-months. A claimed forest stays standing
# (it feeds the sawmills); felling it is a choice (fell_forest) and gives
# wood for every worker-month, then the tile is plain. To tune in the lab.
clear_work_plain = 6
clear_work_hill = 10
clear_work_forest = 12
fell_wood_per_work = 5

[economy]
food_per_child = 6
food_per_adult = 10
food_per_elder = 8
ration_reduced_pct = 70
ration_normal_pct = 100
ration_abundant_pct = 130
# Farm output by season; the yearly average is 100 %.
farm_winter_pct = 50
farm_spring_pct = 100
farm_summer_pct = 120
farm_autumn_pct = 130
# Gold per month = adults * tax_rate / tax_divisor
tax_divisor = 20
max_tax_rate = 30
upkeep_gold_per_building = 1
unpaid_upkeep_output_pct = 50
# Share of the stored food lost every month, after consumption.
food_spoilage_pct = 2
# Fixed rule standing in for Jev: below this reserve, idle adults go to food.
reserve_alert_months = 2

[demography]
birth_permille_per_adult = 15
low_mood_births_below = 300
low_mood_births_pct = 50
high_mood_births_above = 700
high_mood_births_pct = 120
death_child_permille = 3
death_adult_permille = 2
death_elder_permille = 15
famine_death_permille_per_missing_pct = 2
child_to_adult_permille = 33
adult_to_elder_permille = 4

[mood]
base = 500
approach_pct = 25
ration_reduced = -150
ration_abundant = 100
tax_free_rate = 5
tax_per_point = -10
famine_per_missing_pct = -6
famine_max = -400
reserve_bonus_months = 3
reserve_bonus = 50
housing_full = -100
per_death = -5
feast_gold_per_point = 2
feast_max = 100
feast_repeat_pct = 50
# A famine is a shock, not only a lower target: with 25 % inertia per month
# a one- or two-month famine barely moved the mood (game 2: 8 % of the
# people died, unrest stayed calm). Lab variant D, approved 2026-11-07.
famine_shock_per_missing_pct = 4  # per point of missing food, at once
death_shock = 10  # per death of the month, at once

[unrest]
threshold = 350
protest_turns = 2
strike_turns = 4
revolt_turns = 6
strike_output_pct = 70

# What the people may decide each month (engine/people.py). A cheap model
# chooses inside these ranges from the square's words and what weighs on
# the people; fixed rules take the middle when the model is silent.
# Without this section (games saved before) the people decide nothing.
[people]
content_above = 550
discontent_below = 400
# Ranges widened after game 5: effort moved little, births stayed cautious.
effort_content = [0, 15]  # percent added to the yield of fields, sawmill, quarry
effort_neutral = [-8, 8]
effort_discontent = [-25, 0]
birth_content = [100, 125]  # percent of this month's births
birth_neutral = [95, 110]
birth_discontent = [60, 100]
# Granting a petition: half the relief it brings to the people's burdens,
# at once, within these limits; refusing or not answering costs the same.
petition_min_mood = 10
petition_max_mood = 30
