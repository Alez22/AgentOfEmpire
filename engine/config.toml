# Initial balance values for the prototype (one city, one class: peasants).
# All values are integers: "permille" = per thousand, "pct" = per hundred.
# Tuning happens here, never in the code.

[start]
children = 30
adults = 60
elders = 10
food = 1600  # was 2000: a sensible player now reaches spring with a thin margin (lab, game 3)
wood = 150
stone = 100
gold = 100
free_tiles = 7  # only for games without a map (saved before the territory)
workers_food = 53  # was 54: the third stone worker covers the stone upkeep ([needs])
workers_wood = 4
workers_stone = 3  # was 2
tax_rate = 10
ration = "normal"
mood = 500  # was 600: equal to the base, so the mood no longer drifts down by itself
farms = 4
sawmills = 1
quarries = 1
houses = 6

# Each building: cost, construction time, jobs, output per worker per month.
# sector = which resource the workers produce ("" for houses).
# width x height = footprint in tiles; terrain = what every tile must be;
# needs_forest = at least one tile must touch a forest tile.
# hex_steps = the footprint on a hex grid: the anchor plus one tile per path of
# steps from it (docs/DESIGN.md, "Hex grid").
[buildings.farm]
wood = 40
stone = 10
gold = 0
build_turns = 2
jobs = 15
output_per_worker = 16  # was 15: equals the fair land (lab/food_balance.py, 2026-11-09)
sector = "food"
housing = 0
width = 3
height = 3
terrain = "plain"
hex_steps = [["E"], ["SE"], ["SW"], ["W"], ["NW"], ["NE"]]  # a flower of 7

[buildings.sawmill]
wood = 30
stone = 20
gold = 0
build_turns = 2
jobs = 10
output_per_worker = 6
sector = "wood"
housing = 0
width = 2
height = 1
terrain = "plain"
needs_forest = true
hex_steps = [["E"]]

[buildings.quarry]
wood = 40
stone = 10
gold = 0
build_turns = 2
jobs = 10
output_per_worker = 4
sector = "stone"
housing = 0
width = 2
height = 2
terrain = "hill"
hex_steps = [["E"], ["SE"], ["E", "SE"]]  # a rhombus of 4

[buildings.house]
wood = 30
stone = 30
gold = 20
build_turns = 3
jobs = 0
output_per_worker = 0
sector = ""
housing = 20
width = 1
height = 1
terrain = "plain"
hex_steps = []

# The market building (docs/DESIGN.md, "The market as a building, merchants and
# their mood"; lab/village_market.py). Wood only: with 40-60 stone 5-7 realms of
# 8 fell in the lab (the world is short of stone). Its jobs are the merchants
# (sector "trade"); they produce no goods, they cap the lots a month ([market]).
# Only in a zone of purpose "market" (a reserved place in the core).
[buildings.market]
wood = 80
stone = 0
gold = 0
build_turns = 2
jobs = 6
output_per_worker = 0
sector = "trade"
housing = 0
width = 2
height = 1
terrain = "plain"
hex_steps = [["E"]]

# The watchtower (village block B+C, lab/village_bandits.py): it brings the
# Gastaldo, who may keep a militia. One per realm, in a zone of purpose "watch"
# at the village's gate; it can be built from the first month.
[buildings.watchtower]
wood = 40
stone = 20
gold = 0
build_turns = 2
jobs = 0
output_per_worker = 0
sector = ""
housing = 0
width = 1
height = 1
terrain = "plain"
hex_steps = []

# Tools: farms, sawmills and quarries improved in levels (docs/DESIGN.md,
# "Tools"; lab/village_tools.py, 2026-11-12: at 60 wood 40 stone 20 gold for
# the farm's level the realms bought 1-3 levels in 36 months, at half from
# month 3; stone was the bottleneck). Level 1 is the village's; later levels
# will name the town building that unlocks them (needs). Without this section
# (games saved before) there is no improve order.
[tools]
stone_per_level = 1  # a month, for each finished level, with the buildings' own upkeep

[[tools.levels.farm]]
name = "heavy_plough"
bonus_pct = 25  # lab: frees about 4 farmers a farm
wood = 30
stone = 20
gold = 10
build_turns = 2

[[tools.levels.sawmill]]
name = "iron_axes"
bonus_pct = 50
wood = 20
stone = 20
gold = 5
build_turns = 2

[[tools.levels.quarry]]
name = "iron_picks"
bonus_pct = 50
wood = 30
stone = 10
gold = 5
build_turns = 2

# The territory (docs/DESIGN.md, "Territory"). Without this section (games
# saved before) a realm has no map and counts free_tiles instead.
[map]
world_file = "world_hex.txt"  # in engine/maps/; copied into the state at game start (world.txt: square grid)
core_file = "core_hex.toml"  # core.toml: square grid
# Top-left tile of the 8 starting sites; the seed picks one.
sites = [[4, 4], [26, 4], [48, 4], [4, 26], [48, 26], [4, 48], [26, 48], [48, 48]]
# Land levels of each site, same order: [food, wood, stone]. Zero sum: one
# rich, one fair and one poor resource, or all fair. Ordered so that any
# three sites in a row differ in every resource as far as possible (a game
# of N realms takes N sites in a row). Unknown to the players.
site_levels = [
  ["rich", "fair", "poor"], ["poor", "rich", "fair"], ["fair", "poor", "rich"], ["fair", "fair", "fair"],
  ["rich", "poor", "fair"], ["fair", "rich", "poor"], ["poor", "fair", "rich"], ["fair", "fair", "fair"],
]
core_size = 12
square_size = 2
# "square" (games saved before 2026-11-08, with world.txt and core.toml) or "hex" (DESIGN, "Hex grid").
grid = "hex"
square_hex_steps = [["E"], ["SE"], ["E", "SE"]]  # a rhombus of 4
max_zones = 14  # was 12: the core has 12 zones since the watchtower's (2026-11-09)
demolish_gold = 10
demolish_refund_pct = 25  # of the wood and stone the building cost
# Claiming a bordering tile: gold per tile = base + 1 for every claim_step_tiles
# tiles already owned beyond the core. The gold goes to the land fund.
claim_base_gold = 10  # 20 was out of reach with real salaries (lab 2026-11-08, games 20-21)
claim_step_tiles = 8
claim_max_per_order = 4
# Clearing a claimed tile, in worker-months. A claimed forest stays standing
# (it feeds the sawmills); felling it is a choice (fell_forest) and gives
# wood for every worker-month, then the tile is plain. To tune in the lab.
clear_work_plain = 3  # lab: at 6 no farm on new land in two years
clear_work_hill = 10
clear_work_forest = 12
fell_wood_per_work = 10  # lab: at 5 felling paid less than a sawmill worker (6)

# Steady needs for wood and stone, so they are worth trading (lab/market_closed.py,
# docs/DESIGN.md "Market, needs and land levels"). Without this section (games
# saved before) nothing is burnt and buildings need no stone.
[needs]
firewood_months = [11, 12, 1, 2, 3]  # lab: January to March only left wood unsold
firewood_people = 2  # lab: 1 per person was too much (revolts at month 8)
cold_shock_per_pct = 2
stone_upkeep_buildings = 1  # lab: 1 per 2 left stone barely traded
worn_output_loss_pct = 50  # half the missing share, as unpaid gold upkeep halves the output

# The common market (engine/market.py, docs/DESIGN.md "Market, needs and land
# levels"): a warehouse on consignment, nothing from outside but the start
# stock. Values from lab/market_closed.py. Without this section: no market.
[market]
lot_units = 50
start_price = { food = 10, wood = 15, stone = 20 }  # gold per lot, from the labour behind each good
margin_pct = 10  # leaves the game: the gold sink
step_pct = 10
min_price_pct = 50
max_price_pct = 300
cover_months = 3
start_stock_per_realm = { food = 100, wood = 50, stone = 30 }
short_last_lot = true  # game 24: 48 food rotted, nobody could buy less than a lot
no_buying_own_goods = true  # game 24: buying back one's own goods pays the margin twice
# Village block A (2026-11-08): the realm trades only once its market building
# is active, within its merchants' lots; the merchants pay their own tax on the
# gold value of the month's trades instead of the ordinary tax.
needs_building = true
lots_per_merchant = 3  # lab: x 2 cut a quarter of the lots asked
merchant_tax_start = 10  # percent of the trades' value; about 0.6 gold a realm a month in the lab
max_merchant_tax = 30

# Classes born from buildings (docs/DESIGN.md, "The market as a building,
# merchants and their mood"; values from lab/village_market.py, 2026-11-08).
# Each shares the peasants' base, factors (hunger, ration, deaths, housing) and
# unrest thresholds ([mood], [unrest]) and differs in what is here.
[classes.merchants]
approach_pct = 10  # peasants 25: merchants remember a year or more
shock_pct = 50  # they live in the town and buy their food; lab: in full they fell to 0
tax_free_rate = 10  # their own tax, on the trades' value (merchant_tax_start)
tax_per_point = -10
discontent_below = 400
effort_loss_pct = 50  # discontented merchants handle half the lots
max_unrest = "strike"  # a handful of merchants cannot topple the crown
recent_months = 3
busy_use_pct = 40
busy_bonus = 100
idle_malus = -250  # the crown's fault: goods on sale, nothing traded
empty_malus = -80  # the warehouse empty for everyone

# Bandits born from discontent (docs/DESIGN.md, "Bandits, the watchtower, the
# Gastaldo and the militia"; values from lab/village_bandits.py, 2026-11-09).
# Without this section (games saved before) nobody flees and nobody raids.
[bandits]
flee_turns = 3  # lab: below 300 nobody fled before the revolt; now from the protests on
flee_adult_pct = 2  # lab: 3 % after 2 months made the world spiral (pool 10 -> 33, 5 realms of 8 fell)
flee_child_pct = 1
start_min = 5  # lab: about a raid a realm a year; 10-25 felt heavy
start_max = 15
start_realms = 8  # start_min and start_max are for a world of this many realms; scaled to the game's
decline_pct = 5
winter_decline_pct = 10  # December to February
starve_pct = 30  # a pool fed half loses 15 % more
party_size = 8
carry = 25  # about 200 food a raid: a quarter of a month's eating
repel_per_guard = 2  # lab: 4 guards repel half the raids or more; 2 cut the loot by 40 %
guard_weight_pct = 10
max_guard_weight_pct = 80
gastaldo_salary = 2  # as a moderate counsellor of the catalogue (server/council/personas.toml)
# The month a realm falls, part of its people go to the woods (lab
# village_fallen, 2026-11-11: 25 % toppled a neighbour in 2 of 3 runs, 50 %
# the whole world; 10 % doubles the arrivals and adds half the raids).
fallen_adult_pct = 10
fallen_child_pct = 5
fallen_food_pct = 25  # carried away: the pool's food

# The doors and acceptance (village block B+C, stage 2; docs/DESIGN.md, "The
# doors and acceptance"; values from lab/village_migration.py, 2026-11-10).
# Needs [bandits]. Without this section (games saved before) nobody arrives.
[migration]
seek_pct = 10  # of the pool, a month
min_food_months = 1  # lab: 2 months blocked almost every seeker
keep_normal_pct = 25
keep_open_pct = 50  # lab: 90 flooded open realms with 20-47 raiders, the grumbling toppled 3 of 6
closed_min_guards = 2
scarce_food_months = 2
grumble_per_pct = 4  # lab: 10 toppled the open realms with a bigger stream
accumulate = true  # game 32: rounded down, a pool of 2-5 sent nobody all year

# Roads of the world, phase 1 (docs/DESIGN.md, "Roads of the world"; values
# from lab/bands_map.py, 2026-11-13): the bandits as bands on the map, moving
# in weeks, raiding by distance. Needs [bandits] and [map]. Without this
# section (games saved before) the bandits stay one pool and raid anyone.
[bands]
weeks = 4
speed = 8  # road units a week: a site's neighbour on the ring is about a month away
road_cost = { plain = 1, forest = 2, hill = 2, river = 3 }  # no bridges yet
range = 24
rest = true  # lab: without it a realm next to a fallen one was raided almost every month
guard_worth = 3  # odds raiders / (raiders + 3 x guards); lab: 1 made guards weaker than repel_per_guard
stay_pct = 10  # low for now; religion will raise it
join_range = 6
camp_gap = 2
start_gap = 6
split_over = 16
merge_under = 3
merge_range = 10
see = 4
tower_see = 12

# on a site with levels. Fair equals the buildings' values above.
[levels]
# Food was 14/15/18 (rich 18: game 24 and lab "food", 2026-11-08). Lab
# food_balance (2026-11-09): the world ate 3,900 food a year more than it grew,
# a fair realm 5 months a year on the reduced ration; at 15/16/19 a fair realm
# about breaks even, a poor one buys about 16 lots a year, a rich one sells 30+.
food = { poor = 15, fair = 16, rich = 19 }
wood = { poor = 3, fair = 6, rich = 9 }
stone = { poor = 2, fair = 4, rich = 6 }

[economy]
food_per_child = 6
food_per_adult = 10
food_per_elder = 8
ration_reduced_pct = 70
ration_normal_pct = 100
ration_abundant_pct = 130
# Farm output by season; the yearly average is 100 %.
farm_winter_pct = 50
farm_spring_pct = 100
farm_summer_pct = 120
farm_autumn_pct = 130
# Gold per month = adults * tax_rate / tax_divisor
tax_divisor = 20
max_tax_rate = 30
upkeep_gold_per_building = 1
unpaid_upkeep_output_pct = 50
# Share of the stored food lost every month, after consumption.
food_spoilage_pct = 2
# Fixed rule standing in for Jev: below this reserve, idle adults go to food.
reserve_alert_months = 2

[demography]
birth_permille_per_adult = 15
low_mood_births_below = 300
low_mood_births_pct = 50
high_mood_births_above = 700
high_mood_births_pct = 120
death_child_permille = 3
death_adult_permille = 2
death_elder_permille = 15
famine_death_permille_per_missing_pct = 2
child_to_adult_permille = 33
adult_to_elder_permille = 4

[mood]
base = 500
approach_pct = 25
ration_reduced = -100  # was -150: with any tax above 5 % six reduced months were a revolt (lab/second_winter.py, 2026-11-11)
ration_abundant = 100
tax_free_rate = 5
tax_per_point = -10
famine_per_missing_pct = -6
famine_max = -400
reserve_bonus_months = 3
reserve_bonus = 50
housing_full = -100
per_death = -5
feast_gold_per_point = 2
feast_max = 100
feast_repeat_pct = 50
# A famine is a shock, not only a lower target: with 25 % inertia per month
# a one- or two-month famine barely moved the mood (game 2: 8 % of the
# people died, unrest stayed calm). Lab variant D, approved 2026-11-07.
famine_shock_per_missing_pct = 4  # per point of missing food, at once
death_shock = 10  # per death of the month, at once

[unrest]
threshold = 350
protest_turns = 2
strike_turns = 4
revolt_turns = 6
strike_output_pct = 70

# What the people may decide each month (engine/people.py). A cheap model
# chooses inside these ranges from the square's words and what weighs on
# the people; fixed rules take the middle when the model is silent.
# Without this section (games saved before) the people decide nothing.
[people]
content_above = 550
discontent_below = 400
# Ranges widened after game 5: effort moved little, births stayed cautious.
effort_content = [0, 15]  # percent added to the yield of fields, sawmill, quarry
effort_neutral = [-8, 8]
effort_discontent = [-25, 0]
birth_content = [100, 125]  # percent of this month's births
birth_neutral = [95, 110]
birth_discontent = [60, 100]
# Granting a petition: half the relief it brings to the people's burdens,
# at once, within these limits; refusing or not answering costs the same.
petition_min_mood = 10
petition_max_mood = 30
